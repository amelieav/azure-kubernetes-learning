apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: telemetry-demo
  labels:
    app: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: YOUR_ACR_LOGIN_SERVER/telemetry-server:1
          imagePullPolicy: Always
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONITORING_URL
              value: http://monitoring:8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

